<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beach House Guest Guidebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, calm host talking to a guest on their phone; short, kind, useful.
   IDEA: the laminated house binder on the kitchen counter, rebuilt as a phone app.
   PICTURE: an illustrated cover scene (beach, mountain, lake or city) or the host's own photo.
   COLOUR and TYPE: host's main colour dominant, warm sand support, host's accent; Young Serif titles, Outfit text.
   LAYOUT: one phone column; cover, time cards, quick cards, sticky section tabs, then the host's sections. */
:root{color-scheme:light dark;
--bg:light-dark(#fbf7f0,#0d1d21);--card:light-dark(#ffffff,#152a30);--ink:light-dark(#14262b,#eef3f1);
--soft:light-dark(#5b6b6e,#a9b9b9);--line:light-dark(#e8dfd0,#24404a);--sand:light-dark(#efe3cd,#2a3c3a);
--sea:#13505b;--coral:#e4572e;--seaInk:light-dark(var(--sea),#8fd0da)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Outfit,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Young Serif",Georgia,serif;font-weight:400;line-height:1.08;text-wrap:balance;margin:0}
.wrap{max-width:640px;margin:0 auto}
header.hero{position:relative;background:var(--sea);color:#fff;overflow:hidden}
.hero .txt{padding:68px max(5vw,18px) 0;position:relative;z-index:1}
.hero h1{font-size:clamp(32px,9vw,46px)}
.hero p{margin:6px 0 0;opacity:.92}
.hero svg{display:block;width:100%;height:auto}
.hero .photo{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;margin-top:16px}
.langs{position:absolute;z-index:2;right:max(5vw,14px);top:16px;display:flex;gap:4px;background:rgba(0,0,0,.25);border-radius:999px;padding:4px}
.langs button{all:unset;cursor:pointer;font:600 13px Outfit,sans-serif;color:#fff;padding:8px 11px;border-radius:999px;min-width:22px;text-align:center}
.langs button[aria-pressed=true]{background:#fff;color:var(--sea)}
.langs button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.langs.sel{padding:0 4px 0 12px;align-items:center;gap:6px}
.langs.sel .globe{width:16px;height:16px;border:2px solid #fff;border-radius:50%;position:relative;flex:none}
.langs.sel .globe::before{content:"";position:absolute;inset:-2px 3px;border:2px solid #fff;border-radius:50%}
.langs select{appearance:none;background:transparent;border:0;color:#fff;font:600 15px Outfit,system-ui,sans-serif;padding:9px 22px 9px 2px;min-height:40px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 10px) 52%,calc(100% - 5px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.langs select option{color:#14262b}
.langs select:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:999px}
[dir=rtl] .langs{right:auto;left:max(5vw,14px)}
[dir=rtl] .num .n{margin:0}
.time b,.q .v,.q .sub,.contact b,.place h3{unicode-bidi:plaintext}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:-18px max(5vw,16px) 0;position:relative}
.time{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.time small,.q small{display:block;color:var(--soft);font-size:13px}
.time b{font:400 26px "Young Serif",serif;white-space:nowrap}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px max(5vw,16px) 6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.q .v{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.q.wide{grid-column:1/-1}
.q .sub{font-size:13px;color:var(--soft)}
.btn{appearance:none;border:0;cursor:pointer;font:600 15px Outfit,sans-serif;min-height:44px;padding:10px 16px;border-radius:12px;background:var(--sea);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.ghost{background:transparent;color:var(--seaInk);border:1.5px solid currentColor}
.btn:focus-visible,.chip:focus-visible,.check input:focus-visible,nav.tabs a:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:10px max(5vw,16px);scrollbar-width:none}
nav.tabs a{flex:none;color:var(--ink);text-decoration:none;font-weight:500;font-size:15px;padding:8px 14px;border-radius:999px;background:var(--sand)}
nav.tabs a.on{background:var(--sea);color:#fff}
section{padding:26px max(5vw,16px) 8px;scroll-margin-top:62px}
section h2{font-size:32px;margin-bottom:12px}
.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.item h3{font-size:19px;margin-bottom:4px}
.item p{margin:0;color:var(--soft);white-space:pre-line}
.item .btn{margin-top:10px}
details.item summary{cursor:pointer;font:400 19px "Young Serif",serif;list-style:none;display:flex;justify-content:space-between;gap:10px;min-height:28px}
details.item summary::-webkit-details-marker{display:none}
details.item summary::after{content:"+";color:var(--seaInk);font-family:Outfit;font-size:22px;line-height:1}
details.item[open] summary::after{content:"\2013"}
details.item p{margin-top:8px}
.num li{display:flex;gap:12px;align-items:flex-start}
.num .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-weight:600;color:var(--seaInk)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{appearance:none;cursor:pointer;font:500 15px Outfit,sans-serif;min-height:40px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--coral);border-color:var(--coral);color:#fff}
.place{display:flex;justify-content:space-between;gap:12px;align-items:center}
.place .btn{margin:0;flex:none}
.tag{font-size:13px;color:var(--coral);font-weight:600}
.bar{height:10px;background:var(--sand);border-radius:99px;overflow:hidden;margin:4px 0 14px}
.bar i{display:block;height:100%;width:0;background:var(--coral);transition:width .4s}
.check{display:flex;gap:12px;align-items:center;padding:12px 16px;min-height:52px;cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--sea);flex:none}
.check.done label{text-decoration:line-through;color:var(--soft)}
.done-msg{margin-top:12px;padding:14px 16px;border-radius:14px;background:var(--sea);color:#fff}
.contact{display:flex;justify-content:space-between;align-items:center;gap:12px}
.contact>span{flex:1}.contact b{font-size:16px;white-space:nowrap}
.contact a{color:var(--seaInk)}
footer{margin-top:28px;background:var(--sea);color:#fff;padding:28px max(5vw,16px) 40px}
footer h2{font-size:30px;margin-bottom:8px}
footer .btn{background:#fff;color:var(--sea)}
.note{font-size:13px;opacity:.8;margin-top:18px}
.state{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
.state p{color:var(--soft);max-width:34ch}
.demo{padding:12px max(5vw,16px);background:var(--card);border-bottom:1px solid var(--line)}.demo span{display:block;font-size:13px;color:var(--soft);margin-bottom:8px}.demo .chips{flex-wrap:nowrap;overflow-x:auto;margin:0;scrollbar-width:none}.demo .chip{flex:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;transition:transform .3s;z-index:9}
.toast.show{transform:translateX(-50%) translateY(0)}
@keyframes drift{to{transform:translateX(-120px)}}
.drift{animation:drift 9s linear infinite}
@media(prefers-reduced-motion:reduce){.bar i,.toast{transition:none}.drift{animation:none}}
</style>
</head>

function parseCSV(txt){const rows=[];let r=[],f="",q=false;for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c=='"'&&txt[i+1]=='"'){f+='"';i++}else if(c=='"')q=false;else f+=c}else if(c=='"')q=true;else if(c==","){r.push(f);f=""}else if(c=="\n"){r.push(f);rows.push(r);r=[];f=""}else if(c!="\r")f+=c}if(f||r.length){r.push(f);rows.push(r)}return rows}
function toObjects(csv){
  const rows=parseCSV(csv).filter(r=>r.some(c=>c.trim()!==""));
  if(!rows.length)return[];
  const h=rows[0].map(x=>x.trim());
  const clean=v=>{v=(v||"").trim();return /^#(N\/A|ERROR!|VALUE!|REF!|NAME\?|DIV\/0!|NUM!|NULL!)/.test(v)||/^\S{3,24}\.\.\.$/.test(v)?"":v};
  return rows.slice(1).map(r=>{const o={};h.forEach((k,i)=>{if(k)o[k]=clean(r[i])});return o});
}

function photoUrl(u){u=safeUrl(u);if(!u)return"";const m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/);return m?`https://drive.google.com/thumbnail?id=${m[1]}&sz=w1600`:u}

function detectLangs(){
  const found=new Set(["en"]);
  for(const tab of ["Sections","Guide","Places"])for(const row of T[tab])for(const k in row){const m=k.match(/\(([a-z]{2})\)$/i);if(m&&row[k])found.add(m[1].toLowerCase())}
  const want=(T.Basics.find(r=>norm(r.Setting)==="languages")||{})["Value (en)"]||"";
  const pick=want.toLowerCase().match(/\b[a-z]{2}\b/g);
  LANGS=[...found].filter(l=>l==="en"||!pick||!/[a-z]{2}\b/.test(want)||pick.includes(l)||/^all$/i.test(want.trim()));
}

10 36 L77 -4 L164 36Z\" fill=\"#c2411b\"/><path d=\"M77 -4 L164 36 L156 36 L77 2Z\" style=\"fill:var(--coral)\"/>\n      <rect x=\"0\" y=\"36\" width=\"154\" height=\"40\" fill=\"#f3ece0\"/><rect x=\"0\" y=\"42\" width=\"154\" height=\"1.5\" fill=\"#d9cdb8\"/><rect x=\"0\" y=\"51\" width=\"154\" height=\"1.5\" fill=\"#d9cdb8\"/><rect x=\"0\" y=\"60\" width=\"154\" height=\"1.5\" fill=\"#d9cdb8\"/><rect x=\"0\" y=\"69\" width=\"154\" height=\"1.5\" fill=\"#d9cdb8\"/>\n      <rect x=\"12\" y=\"44\" width=\"22\" height=\"18\" rx=\"1.5\" fill=\"#ffd9a8\"/><path d=\"M23 44v18M12 53h22\" stroke=\"#fff\" stroke-opacity=\".7\" stroke-width=\"1.5\"/><rect x=\"120\" y=\"44\" width=\"22\" height=\"18\" rx=\"1.5\" fill=\"#ffd9a8\"/><path d=\"M131 44v18M120 53h22\" stroke=\"#fff\" stroke-opacity=\".7\" stroke-width=\"1.5\"/><rect x=\"62\" y=\"44\" width=\"30\" height=\"32\" fill=\"#ffd9a8\"/><path d=\"M77 44 V76\" stroke=\"#fff\" stroke-width=\"1.5\"/>\n      <rect x=\"-8\" y=\"76\" width=\"170\" height=\"6\" fill=\"#b98f5c\"/><rect x=\"-6\" y=\"64\" width=\"2.5\" height=\"12\" fill=\"#fff\"/><rect x=\"14\" y=\"64\" width=\"2.5\" height=\"12\" fill=\"#fff\"/><rect x=\"34\" y=\"64\" width=\"2.5\" height=\"12\" fill=\"#fff\"/><rect x=\"54\" y=\"64\" width=\"2.5\" height=\"12\" fill=\"#fff\"/><rect x=\"74\" y=\"64\" width=\"2.5\" height=\"12\" fill=\"#fff\"/><rect x=\"94\" y=\"64\" width=\"2.5\" height=\"12\" fill=\"#fff\"/><rect x=\"114\" y=\"64\" width=\"2.5\" height=\"12\" fill=\"#fff\"/><rect x=\"134\" y=\"64\" width=\"2.5\" height=\"12\" fill=\"#fff\"/><rect x=\"154\" y=\"64\" width=\"2.5\" height=\"12\" fill=\"#fff\"/><rect x=\"-8\" y=\"63\" width=\"170\" height=\"2.5\" fill=\"#fff\"/>\n      <path d=\"M162 82 L196 118\" stroke=\"#b98f5c\" stroke-width=\"6\"/>\n    </g>\n    <g transform=\"translate(354 214) scale(1.05)\"><path d=\"M0 0 Q6 -40 -4 -80\" stroke=\"#7a5536\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M0 0 Q6 -40 -4 -80\" stroke=\"#a07448\" stroke-width=\"2\" fill=\"none\" stroke-dasharray=\"3 5\"/><g transform=\"translate(-4 -80)\" fill=\"#3d7a4f\"><path d=\"M0 0 Q-24 -10 -42 4 Q-22 -2 0 0Z\"/><path d=\"M0 0 Q22 -12 42 2 Q22 -2 0 0Z\"/><path d=\"M0 0 Q-10 -24 -30 -26 Q-12 -14 0 0Z\"/><path d=\"M0 0 Q14 -22 34 -22 Q14 -12 0 0Z\"/><path d=\"M0 0 Q-2 -22 6 -36 Q4 -16 0 0Z\"/></g><circle cx=\"-6\" cy=\"-78\" r=\"3\" fill=\"#5b3a26\"/><circle cx=\"-1\" cy=\"-77\" r=\"3\" fill=\"#5b3a26\"/></g>\n    <g transform=\"translate(70 222)\"><path d=\"M0 0 V-40\" stroke=\"#6b4428\" stroke-width=\"2\"/><path d=\"M-24 -36 Q0 -58 24 -36Z\" style=\"fill:var(--coral)\"/><path d=\"M-24 -36 Q-12 -44 0 -36 Q12 -44 24 -36\" fill=\"#fff\" opacity=\".5\"/><path d=\"M8 0 l14 -10 h14\" stroke=\"#fff\" stroke-width=\"3\" fill=\"none\"/></g></svg>";
function sceneKey(){return""}
function scene(){return COVER}
function sectionHTML(sec,si){
  const name=sec["Section (en)"]==="__more"?t("more"):(tr(sec,"Section")||sec["Section (en)"]),id=slug(sec["Section (en)"])+"-"+si,type=(sec.Type||"Cards").toLowerCase();
  const items=sec.items||T.Guide.filter(g=>norm(g.Section)===norm(sec["Section (en)"])&&yes(g.Show));
  const link=g=>{const u=safeUrl(g.Link);return u?`<a class="btn ghost" href="${esc(u)}">${esc(t("open"))}</a>`:""};
  let inner="";
  if(type==="places"){
    const P=T.Places.filter(p=>p.Name&&yes(p.Show));
    const cats=[...new Set(P.map(p=>p["Category (en)"]).filter(Boolean))];
    const label=c=>tr(P.find(p=>p["Category (en)"]===c),"Category");
    inner=(cats.length>1?`<div class="chips">${["all",...cats].map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${c===cat}">${esc(c==="all"?t("all"):label(c))}</button>`).join("")}</div>`:"")+
      `<ul class="list">${P.filter(p=>cat==="all"||p["Category (en)"]===cat).map(p=>`<li class="item place"><div>${p["Category (en)"]?`<span class="tag">${esc(tr(p,"Category"))}</span>`:""}<h3>${esc(p.Name)}</h3><p>${esc(tr(p,"Note"))}</p></div><a class="btn ghost" href="${maps(p["Map search"]||[p.Name,basic("city")].filter(Boolean).join(", "))}">${esc(t("go"))}</a></li>`).join("")}</ul>`;
  }else if(type==="accordion"){
    inner=`<div class="list">${items.map((g,i)=>`<details class="item"${i?"":" open"}><summary>${esc(tr(g,"Title"))}</summary><p>${esc(tr(g,"Text"))}</p>${link(g)}</details>`).join("")}</div>`;
  }else if(type==="numbered"){
    inner=`<ul class="list num">${items.map((g,i)=>`<li class="item"><span class="n">${i+1}</span><div>${tr(g,"Title")?`<h3>${esc(tr(g,"Title"))}</h3>`:""}<span>${esc(tr(g,"Text"))}</span>${link(g)}</div></li>`).join("")}</ul>`;
  }else if(type==="checklist"){
    const d=done[id]||[],n=items.length,k=items.filter((_,i)=>d.includes(i)).length;
    inner=`<div class="bar"><i style="width:${n?k/n*100:0}%"></i></div><ul class="list">${items.map((g,i)=>`<li class="item check${d.includes(i)?" done":""}"><input type="checkbox" id="${id}-c${i}" data-sec="${id}" data-i="${i}"${d.includes(i)?" checked":""}><label for="${id}-c${i}">${esc(tr(g,"Text")||tr(g,"Title"))}</label></li>`).join("")}</ul>${n&&k===n?`<div class="done-msg">${esc(t("alldone"))}</div>`:""}`;
  }else if(type==="contacts"){
    inner=`<ul class="list">${items.map(g=>`<li class="item contact"><span>${esc(tr(g,"Title"))}</span><a href="${tel(g["Text (en)"]||tr(g,"Text"))}" dir="ltr"><b>${esc(g["Text (en)"]||tr(g,"Text"))}</b></a></li>`).join("")}</ul>`;
  }else{
    inner=`<ul class="list">${items.map(g=>`<li class="item">${tr(g,"Title")?`<h3>${esc(tr(g,"Title"))}</h3>`:""}<p>${esc(tr(g,"Text"))}</p>${link(g)}</li>`).join("")}</ul>`;
  }
  return {id,name,html:`<section id="${id}"><h2>${esc(name)}</h2>${inner}</section>`};
}

function render(){
  const y=scrollY;
  document.documentElement.lang=lang;document.documentElement.dir=RTL.has(lang)?"rtl":"ltr";
  const r=document.documentElement.style;
  r.setProperty("--sea",hex(look("main_color"),"#13505b"));
  r.setProperty("--coral",hex(look("accent_color"),"#e4572e"));
  const name=basic("property_name")||"Welcome";document.title=name;
  const photo=photoUrl(look("cover_photo"));
  const known=new Set(T.Sections.map(s=>norm(s["Section (en)"])).filter(Boolean));
  const orphans=T.Guide.filter(g=>(tr(g,"Text")||tr(g,"Title"))&&yes(g.Show)&&!known.has(norm(g.Section)));
  const secList=T.Sections.filter(s=>s["Section (en)"]&&yes(s.Show));
  if(orphans.length)secList.push({"Section (en)":"__more",Type:"Cards",items:orphans});
  const secs=secList.map(sectionHTML);
  const door=basic("door_code"),showDoor=door&&yes(basic("show_door_code"));
  const phone=basic("host_phone"),addr=basic("address"),review=safeUrl(basic("review_link"));
  const DEMO=[];
  $("app").innerHTML=`
  ${false?`<div class="demo"><span>Cover style (preview only)</span><div class="chips">${DEMO.map(([k,l])=>`<button class="chip" data-demo="${k}" aria-pressed="${(demoTheme||sceneKey(look("theme")))===k}">${l}</button>`).join("")}</div></div>`:""}
  <header class="hero">
    <div class="txt"><h1>${esc(name)}</h1><p>${esc(basic("welcome_message"))}</p></div>
    ${photo&&!demoTheme?`<img class="photo" src="${esc(photo)}" alt="" onerror="this.remove();document.getElementById('fallback').style.display='block'"><div id="fallback" style="display:none">${scene(sceneKey(look("theme")))}</div>`:scene(demoTheme||sceneKey(look("theme")))}
    ${LANGS.length>4?`<label class="langs sel"><span class="globe" aria-hidden="true"></span><select id="langSel" aria-label="Language">${LANGS.map(l=>`<option value="${l}"${l===lang?" selected":""}>${NATIVE[l]||l.toUpperCase()}</option>`).join("")}</select></label>`:LANGS.length>1?`<div class="langs" role="group" aria-label="Language">${LANGS.map(l=>`<button data-lang="${l}" aria-pressed="${l===lang}">${l.toUpperCase()}</button>`).join("")}</div>`:""}
  </header>
  <div class="times"><div class="time"><small>${esc(t("checkin"))}</small><b>${esc(basic("checkin_time"))}</b></div><div class="time"><small>${esc(t("checkout"))}</small><b>${esc(basic("checkout_time"))}</b></div></div>
  <div class="quick">
    ${basic("wifi_name")||basic("wifi_password")?`<div class="q wide"><small>${esc(t("wifi"))}</small><span class="v">${esc(basic("wifi_name"))}</span><div class="row"><span class="v">${esc(basic("wifi_password"))}</span>${basic("wifi_password")?`<button class="btn" id="copyWifi">${esc(t("copy"))}</button>`:""}</div></div>`:""}
    ${showDoor?`<div class="q"><small>${esc(t("door"))}</small><span class="v">${showCode?esc(door):"••••"}</span><button class="btn ghost" id="showDoor">${esc(showCode?t("hide"):t("reveal"))}</button></div>`:""}
    ${basic("host_name")||phone?`<div class="q${showDoor?"":" wide"}"><small>${esc(t("host"))}</small><span class="v">${esc(basic("host_name"))}</span>${phone?`<a class="btn ghost" href="${tel(phone)}">${esc(t("call"))}</a><span class="sub">${esc(phone)}</span>`:""}</div>`:""}
    ${addr?`<div class="q wide"><small>${esc(t("address"))}</small><span class="v">${esc(addr)}</span><a class="btn ghost" href="${maps(addr)}">${esc(t("maps"))}</a></div>`:""}
  </div>
  ${secs.length?`<nav class="tabs" id="tabs">${secs.map(s=>`<a href="#${s.id}" data-s="${s.id}">${esc(s.name)}</a>`).join("")}</nav>`:""}
  ${secs.map(s=>s.html).join("")}
  <footer><h2>${esc(t("thanks"))}</h2>${review?`<p>${esc(t("review"))}</p><a class="btn" href="${esc(review)}">${esc(t("reviewBtn"))}</a>`:""}${isSample?`<p class="note">${esc(t("sample"))}</p>`:""}</footer>`;
  render.secs=secs.map(s=>s.id);
  scrollTo(0,y);spy();
}
function spy(){
  const ids=render.secs||[];let cur=ids[0];
  for(const s of ids){const el=$(s);if(el&&el.getBoundingClientRect().top<120)cur=s}
  document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on",a.dataset.s===cur));
}
function toast(m){const el=$("toast");el.textContent=m;el.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove("show"),1800)}
function save(){try{localStorage.setItem("gb:"+(render.key||"sample"),JSON.stringify({lang,done}))}catch(e){}}

$("app").addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.lang){lang=b.dataset.lang;save();render()}
  else if(b.id==="copyWifi"){try{await navigator.clipboard.writeText(basic("wifi_password"));toast(t("copied"))}catch(err){toast(basic("wifi_password"))}}
  else if(b.id==="showDoor"){showCode=!showCode;render()}
  else if(b.dataset.cat){cat=b.dataset.cat;render()}
  else if(b.dataset.demo){demoTheme=b.dataset.demo;render()}
  else if(b.id==="retry"){start()}
});
$("app").addEventListener("change",e=>{
  const c=e.target;
  if(c.id==="langSel"){lang=c.value;save();render();return}
  if(!c.dataset.sec)return;
  const a=new Set(done[c.dataset.sec]||[]);c.checked?a.add(+c.dataset.i):a.delete(+c.dataset.i);done[c.dataset.sec]=[...a];save();render();
});
addEventListener("scroll",spy,{passive:true});

function sheetId(v){const m=String(v||"").match(/\/d\/([a-zA-Z0-9_-]{20,})/);return m?m[1]:(/^[a-zA-Z0-9_-]{20,}$/.test(v||"")?v:"")}
async function start(){
  let p;try{p=new URLSearchParams(location.search)}catch(e){p=new URLSearchParams()}
  const id=sheetId(p.get("id")),base=p.get("csv");
  let src=null;
  if(id)src=tab=>`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(tab)}&t=${Date.now()}`;
  else if(base)src=tab=>`${base.replace(/\/$/,"")}/${encodeURIComponent(tab)}.csv`;
  try{
    if(src){
      $("app").innerHTML=`<div class="state"><p>Loading your guidebook…</p></div>`;
      const texts=await Promise.all(TABS.map(async tab=>{try{const r=await fetch(src(tab),{cache:"no-store"});return r.ok?await r.text():""}catch(e){return""}}));
      T={};TABS.forEach((tab,i)=>{const rows=toObjects(texts[i]);T[tab]=rows.length&&(KEYCOL[tab] in rows[0])?rows:[]});
      if(!T.Basics.length)throw new Error("empty");
      render.key=id||base;
    }else{T={};TABS.forEach(tab=>T[tab]=toObjects(SAMPLE[tab]));isSample=true}
  }catch(err){
    $("app").innerHTML=`<div class="state"><div><p>${esc(UI.en.err)}</p><button class="btn" id="retry">${esc(UI.en.retry)}</button></div></div>`;return;
  }
  detectLangs();
  try{const s=JSON.parse(localStorage.getItem("gb:"+(render.key||"sample"))||"{}");if(LANGS.includes(s.lang))lang=s.lang;else{const n=(navigator.language||"en").slice(0,2);if(LANGS.includes(n))lang=n}done=s.done||{}}catch(e){}
  render();
}
start();
}
</script>
